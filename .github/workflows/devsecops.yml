name: 🛡️ DevSecOps Pipeline (Trivy - ZAP - SARIF)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-scan:
    name: 🏗️ Build and Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Quyền để đẩy kết quả vào tab Security
      actions: read

    steps:
    - name: 📥 Checkout source code
      uses: actions/checkout@v4 # Nâng cấp lên v4

    # KỊCH BẢN 1: QUÉT TĨNH (SCA) VỚI TRIVY
    - name: 🐳 1. Quét Lỗ hổng Docker Image (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: "bkimminich/juice-shop:latest"
        format: "sarif"
        output: "trivy-results.sarif"
        vuln-type: "os,library"
        severity: "CRITICAL,HIGH"
        exit-code: "1"

    # ĐẨY KẾT QUẢ TRIVY LÊN GIAO DIỆN GITHUB
    - name: 🚀 2. Upload kết quả Trivy lên GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3 # Nâng cấp lên v3
      if: always()
      with:
        sarif_file: "trivy-results.sarif"

    # CHUẨN BỊ MÔI TRƯỜNG CHO QUÉT ĐỘNG (DAST)
    - name: 🏗️ 3. Khởi động Juice Shop (Docker)
      if: always()
      run: |
        docker run --rm -d -p 3000:3000 bkimminich/juice-shop
        echo "Chờ server khởi động trong 20s..."
        sleep 20

    # KỊCH BẢN 2 & 3: QUÉT ĐỘNG (DAST) VỚI OWASP ZAP
    - name: ⚡ 4. Quét bảo mật động (OWASP ZAP Baseline Scan)
      uses: zaproxy/action-baseline@v0.12.0 # Bản này vẫn ổn định
      if: always()
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        target: 'http://localhost:3000'
        cmd_options: '-a'

    # LƯU BÁO CÁO ZAP (ARTIFACT V4)
    - name: 📊 5. Lưu báo cáo ZAP (Artifact)
      uses: actions/upload-artifact@v4 # Nâng cấp lên v4 - KHẮC PHỤC LỖI CỦA BẠN
      if: always()
      with:
        name: zap-scan-report
        path: zap_report.html
