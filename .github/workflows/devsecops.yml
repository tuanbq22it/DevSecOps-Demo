name: Advanced DevSecOps Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  security-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # BẮT BUỘC để dùng tính năng Code Scanning của GitHub
      actions: read

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. 🔴 Rà quét Bí mật bị lộ (Secret Scanning)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "1"
          scanners: "secret"
          severity: "CRITICAL,HIGH"

      - name: 3. 🐳 Quét Lỗ hổng Docker Image (Trivy)
        if: always() # Chạy để lấy báo cáo kể cả khi bước 2 fail
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "bkimminich/juice-shop:latest"
          format: "sarif" # <--- ĐÃ SỬA: Đổi từ json sang sarif
          output: "trivy-results.sarif" # <--- ĐÃ SỬA: Tên file kết quả
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: 🚀 3.1. Upload kết quả lên GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: 4. 🚀 Khởi động Ứng dụng Mục tiêu
        if: always()
        run: |
          docker run --rm -d -p 3000:3000 --name juice-shop bkimminich/juice-shop:latest
          echo "Waiting for app to start..."
          sleep 30

      - name: 5. ⚡ Quét Giao diện & API (OWASP ZAP)
        if: always()
        run: |
          chmod 777 $(pwd)
          docker run --network host -v $(pwd):/zap/wrk/:rw -t zaproxy/zap-stable zap-baseline.py \
          -t http://localhost:3000 \
          -r zap-report.html \
          -x zap-report.xml

      - name: 6. 📁 Lưu trữ File Báo cáo (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DevSecOps-Reports
          path: |
            trivy-results.sarif
            zap-report.html
            zap-report.xml

      - name: 7. 🚨 GỬI EMAIL BÁO ĐỘNG
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚨 [CẢNH BÁO DEVSECOPS] Hệ thống bị lỗi bảo mật!"
          to: ${{ secrets.MAIL_TO }}
          from: "DevSecOps CI/CD Bot"
          body: |
            Cảnh báo từ hệ thống tự động!
            
            Quy trình triển khai đã bị chặn lại do Trivy phát hiện lỗ hổng nghiêm trọng (CVE) HOẶC OWASP ZAP phát hiện cấu hình sai lệch.
            
            Vui lòng đăng nhập vào GitHub, kiểm tra tab Security hoặc tải file Artifact báo cáo chi tiết về máy.
