name: 🛡️ DevSecOps Pipeline (Trivy - ZAP - SARIF)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-scan:
    name: 🏗️ Build and Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # BẮT BUỘC để upload file SARIF
      actions: read

    steps:
    - name: 📥 Checkout source code
      uses: actions/checkout@v3

    # KỊCH BẢN 1: QUÉT TĨNH (SCA) VỚI TRIVY
    - name: 🐳 1. Quét Lỗ hổng Docker Image (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: "bkimminich/juice-shop:latest"
        format: "sarif"           # Đã đổi từ json sang sarif
        output: "trivy-results.sarif"
        vuln-type: "os,library"
        severity: "CRITICAL,HIGH"
        exit-code: "1"            # Dừng pipeline nếu thấy lỗi nghiêm trọng (như JWT CVE)

    # ĐẨY KẾT QUẢ TRIVY LÊN GIAO DIỆN GITHUB
    - name: 🚀 2. Upload kết quả Trivy lên GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()                # Luôn chạy để xem báo cáo kể cả khi bị fail ở bước trên
      with:
        sarif_file: "trivy-results.sarif"

    # CHUẨN BỊ MÔI TRƯỜNG CHO QUÉT ĐỘNG (DAST)
    - name: 🏗️ 3. Khởi động Juice Shop (Docker)
      if: always()
      run: |
        docker run --rm -d -p 3000:3000 bkimminich/juice-shop
        echo "Chờ server khởi động trong 15s..."
        sleep 15

    # KỊCH BẢN 2 & 3: QUÉT ĐỘNG (DAST) VỚI OWASP ZAP
    - name: ⚡ 4. Quét bảo mật động (OWASP ZAP Baseline Scan)
      uses: zaproxy/action-baseline@v0.12.0
      if: always()
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        target: 'http://localhost:3000' # Target nội bộ trong runner
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
        # ZAP sẽ phát hiện lỗi CORS (Kịch bản 3) và Bypassing 403 (Kịch bản 2)

    - name: 📊 5. Lưu báo cáo ZAP (Artifact)
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: zap-scan-report
        path: zap_report.html
